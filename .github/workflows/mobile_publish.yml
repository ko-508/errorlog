name: Mobile Publish

on:
  push:
    branches: [main]
    paths: ['drafts/*.md']
  workflow_dispatch:
    inputs:
      slug:
        description: "スラッグ（drafts/ に置いたファイル名、例: nginx_502）"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
  issues: write

concurrency:
  group: mobile-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    outputs:
      head_sha: ${{ steps.push.outputs.head_sha }}
      title: ${{ steps.process.outputs.title }}
      slug: ${{ steps.process.outputs.slug }}
      zenn: ${{ steps.process.outputs.zenn }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y fonts-noto-cjk fonts-liberation

      - name: Install Python dependencies
        run: pip install pillow pyyaml

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.161.1"
          extended: true

      - name: Configure git
        run: |
          git config user.name "ErrorLog Bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Process article
        id: process
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          INPUT_SLUG: ${{ github.event.inputs.slug }}
          OGP_FONT_MONO: /usr/share/fonts/truetype/liberation/LiberationMono-Bold.ttf
          OGP_FONT_JP: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
          OGP_FONT_JP_BOLD: /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            python3 scripts/mobile_publish.py --before "$BEFORE_SHA" --after "$AFTER_SHA"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python3 scripts/mobile_publish.py --slug "$INPUT_SLUG"
          else
            echo "未対応のイベントです: $EVENT_NAME" >&2
            exit 1
          fi

      - name: Pull rebase and verify content
        env:
          SLUG: ${{ steps.process.outputs.slug }}
        run: |
          git pull --rebase || {
            echo "git pull --rebase が失敗しました。競合を手動で解決してください。" >&2
            exit 1
          }

          python3 - << 'PYEOF'
          import os, sys
          from pathlib import Path

          slug = os.environ["SLUG"]
          if not slug:
              print("process ステップから slug が出力されていません。", file=sys.stderr)
              sys.exit(1)

          current = Path(f"content/posts/{slug}.md").read_text(encoding="utf-8")
          validated = Path("/tmp/validated_article.md").read_text(encoding="utf-8")

          if current != validated:
              print("rebase により記事の内容が変わりました。", file=sys.stderr)
              print("drafts/<slug>.md を更新してから再実行してください。", file=sys.stderr)
              sys.exit(1)

          print("rebase 後の内容確認 OK")
          PYEOF

      - name: Push
        id: push
        run: |
          git push
          SHA=$(git rev-parse HEAD)
          echo "head_sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "push OK: ${SHA}"

  deploy:
    needs: publish
    if: needs.publish.result == 'success'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  zenn:
    needs: publish
    if: needs.publish.result == 'success' && needs.publish.outputs.zenn == 'true'
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SLUG: ${{ needs.publish.outputs.slug }}
      HEAD_SHA: ${{ needs.publish.outputs.head_sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Trigger and wait for Zenn sync
        run: |
          if [ -z "$SLUG" ] || [ -z "$HEAD_SHA" ]; then
            echo "Zenn 同期に必要な slug または head_sha がありません。slug=$SLUG, head_sha=$HEAD_SHA" >&2
            exit 1
          fi

          gh workflow run zenn_sync.yml \
            --ref main \
            -f "slugs=${SLUG}"

          RUN_ID=""
          for i in $(seq 1 30); do
            sleep 3
            RUN_ID=$(gh run list \
              --workflow zenn_sync.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"${HEAD_SHA}\") | .databaseId" \
              | head -1)
            [ -n "$RUN_ID" ] && break
          done

          if [ -z "$RUN_ID" ]; then
            echo "Zenn 同期の実行を特定できませんでした（headSha=${HEAD_SHA}）" >&2
            exit 1
          fi

          echo "Zenn 同期 run_id: ${RUN_ID}"
          gh run watch "${RUN_ID}" --exit-status

  summary:
    needs: [publish, deploy, zenn]
    if: always()
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE: ${{ vars.MOBILE_PUBLISH_ISSUE }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
      ZENN_RESULT: ${{ needs.zenn.result }}
      TITLE: ${{ needs.publish.outputs.title }}
      SLUG: ${{ needs.publish.outputs.slug }}
      SYNC_ZENN: ${{ needs.publish.outputs.zenn }}
      HEAD_SHA: ${{ needs.publish.outputs.head_sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Create summary and issue comment
        run: |
          python3 - << 'PYEOF'
          import os
          from pathlib import Path

          publish_result = os.environ["PUBLISH_RESULT"]
          deploy_result = os.environ["DEPLOY_RESULT"]
          zenn_result = os.environ["ZENN_RESULT"]
          title = os.environ["TITLE"]
          slug = os.environ["SLUG"]
          sync_zenn_raw = os.environ["SYNC_ZENN"]
          head_sha = os.environ["HEAD_SHA"]
          run_url = os.environ["RUN_URL"]

          publish_ok = publish_result == "success"
          if publish_ok and sync_zenn_raw not in {"true", "false"}:
              raise SystemExit(f"publish ジョブの zenn 出力が不正です: {sync_zenn_raw!r}")
          if publish_ok and (not title or not slug or not head_sha):
              raise SystemExit(
                  "publish ジョブ成功時に必要な出力がありません: "
                  f"title={title!r}, slug={slug!r}, head_sha={head_sha!r}"
              )

          sync_zenn = sync_zenn_raw == "true"
          deploy_ok = deploy_result == "success"
          zenn_ok = (not sync_zenn) or zenn_result == "success"
          overall_ok = publish_ok and deploy_ok and zenn_ok

          if not publish_ok:
              stage = "公開処理（記事検証・コミット・push）"
          elif not deploy_ok:
              stage = "サイト公開（deploy）"
          elif not zenn_ok:
              stage = "Zenn 同期"
          else:
              stage = "完了"

          publish_label = publish_result
          if publish_ok:
              publish_label = f"成功（コミット: {head_sha[:8]}）"

          lines = [
              "# Mobile Publish 公開結果",
              "",
              f"- {'✅' if publish_ok else '❌'} 公開処理（push）: {publish_label}",
              f"- {'✅' if deploy_ok else '❌'} サイト公開（deploy）: {deploy_result}",
          ]
          if sync_zenn:
              lines.append(f"- {'✅' if zenn_ok else '❌'} Zenn 同期: {zenn_result}")
          else:
              lines.append("- ➖ Zenn 同期: 不要")
          lines.extend(["", f"実行: {run_url}"])

          if not publish_ok:
              lines.extend(["", "失敗したステップのログを参照してください。", f"ログ: {run_url}"])
          elif overall_ok:
              url = f"https://errorlog.jp/posts/{slug}/?utm_source=x&utm_medium=social&utm_campaign=article_share"
              lines.extend([
                  "",
                  "## 公開完了",
                  "",
                  f"URL: {url}",
                  "",
                  "## X 投稿用",
                  "",
                  "```text",
                  title,
                  url,
                  "```",
              ])
              Path("/tmp/mobile_publish_x.txt").write_text(
                  f"{title}\n{url}", encoding="utf-8"
              )
          elif not deploy_ok:
              lines.extend([
                  "",
                  f"記事はリポジトリに追加されています（コミット: {head_sha[:8]}）。",
                  "サイトへの反映はまだです。",
                  "再実行: Actions → Deploy Hugo to GitHub Pages → Run workflow",
              ])
          else:
              url = f"https://errorlog.jp/posts/{slug}/?utm_source=x&utm_medium=social&utm_campaign=article_share"
              lines.extend([
                  "",
                  f"サイトへの公開は成功しました: {url}",
                  "Zenn 同期が失敗しました。",
                  "再実行: Actions → Sync to Zenn → Run workflow → slugs 欄にスラッグを入力",
              ])

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8", newline="\n") as summary:
              summary.write("\n".join(lines) + "\n")

          status = "成功" if overall_ok else "失敗"
          icon = "✅" if overall_ok else "❌"
          status_lines = [
              f"{icon} Mobile Publish {status}",
              f"段階: {stage}",
              f"実行: {run_url}",
          ]
          Path("/tmp/mobile_publish_status.md").write_text(
              "\n".join(status_lines), encoding="utf-8"
          )
          PYEOF

          if [ -z "$ISSUE" ]; then
            echo "vars.MOBILE_PUBLISH_ISSUE が空です。通知先 Issue を設定してください。" | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          fi

          gh issue comment "$ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/mobile_publish_status.md

          if [ -f /tmp/mobile_publish_x.txt ]; then
            gh issue comment "$ISSUE" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file /tmp/mobile_publish_x.txt
          fi
